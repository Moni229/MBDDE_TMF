yahoo:
  source:
    format: cloudFiles
    schema: yahoo
    options:
      cloudFiles.format: parquet
      cloudFiles.inferColumnTypes: true
      cloudFiles.schemaEvolutionMode: addNewColumns
  sinks:
    bronze:
      partitionBy:
        - _ingested_at
    silver:
      partitionBy:
        - year
        - month
        - day

fred:
  source:
    format: cloudFiles
    schema: fred
    options:
      cloudFiles.format: json
      cloudFiles.inferColumnTypes: true
      cloudFiles.schemaEvolutionMode: addNewColumns
  sinks:
    bronze:
      partitionBy:
        - _ingested_at
    silver:
      partitionBy:
        - year
        - month
        - day

eurostat:
  source:
    format: cloudFiles
    schema: eurostat
    options:
      cloudFiles.format: json
      cloudFiles.inferColumnTypes: true
      cloudFiles.schemaEvolutionMode: addNewColumns
  sinks:
    bronze:
      partitionBy:
        - _ingested_at
    silver:
      partitionBy:
        - year
        - month
        - day


finnhub:
  source:
    format: kafka
    schema: finnhub
    options:
      subscribe: finnhub
      startingOffsets: earliest
  sinks:
    bronze:
      run_mode: streaming
      partitionBy:
        - _ingested_at
    silver:
      partitionBy:
        - year
        - month
        - day